services:
  db:
    image: postgres:16-alpine
    container_name: invoice-analysis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_analysis}
      POSTGRES_USER: ${POSTGRES_USER:-invoice_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoice_pass}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-invoice_runtime_pass}
    volumes:
      - invoice-analysis-postgres:/var/lib/postgresql/data
      - ./scripts/010-create-runtime-role.sh:/docker-entrypoint-initdb.d/010-create-runtime-role.sh:ro
      - ./scripts/011-arq-01-rls-hardening.sql:/docker-entrypoint-initdb.d/011-arq-01-rls-hardening.sql:ro
      - ./scripts/verify-arq-01-rls.sql:/opt/invoice-analysis/verify-arq-01-rls.sql:ro
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoice_app} -d ${POSTGRES_DB:-invoice_analysis}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: invoice-analysis-app:local
    container_name: invoice-analysis-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://invoice_runtime:${POSTGRES_RUNTIME_PASSWORD:-invoice_runtime_pass}@db:5432/${POSTGRES_DB:-invoice_analysis}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3005:3000"

volumes:
  invoice-analysis-postgres:
